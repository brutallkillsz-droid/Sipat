<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SIPAT - Shopee LMG-48</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shopee: { DEFAULT: '#EE4D2D', dark: '#d64428', light: '#fff0ed' },
                        darkbg: '#1f2937', surface: '#ffffff'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .card-interaction { transition: all 0.3s ease; }
        .card-interaction:hover { background-color: #EE4D2D; transform: translateY(-5px); color: white !important; shadow: 0 10px 15px rgba(238,77,45,0.4); }
        .card-interaction:hover i, .card-interaction:hover span { color: white !important; }
        .slide-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 998; opacity: 0; pointer-events: none; transition: 0.3s; }
        .slide-overlay.active { opacity: 1; pointer-events: all; }
        .slide-panel { position: fixed; top: 0; right: 0; width: 100%; max-width: 450px; height: 100vh; background: #fff; z-index: 999; transform: translateX(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .slide-panel.active { transform: translateX(0); }
        .status-dropdown { position: fixed; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 9999; opacity: 0; pointer-events: none; transition: 0.1s; display: flex; flex-direction: column; min-width: 150px; }
        .status-dropdown.active { opacity: 1; pointer-events: all; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col h-screen">

<div id="statusDropdown" class="status-dropdown">
    <button class="w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 text-yellow-600 font-bold text-sm" onclick="window.atualizarStatus('Pendente')">Pendente</button>
    <button class="w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 text-green-600 font-bold text-sm" onclick="window.atualizarStatus('Resolvido')">Resolvido</button>
    <button class="w-full text-left px-3 py-2 rounded-md hover:bg-gray-100 text-red-600 font-bold text-sm" onclick="window.atualizarStatus('Cancelado')">Cancelado</button>
</div>

<div id="slide-overlay" class="slide-overlay" onclick="window.fecharDetalhes()"></div>
<div id="slide-panel" class="slide-panel">
    <div class="p-6 border-b flex justify-between items-center">
        <h2 class="font-bold text-lg">Ficha da Ocorrência</h2>
        <button onclick="window.fecharDetalhes()"><i class="fa-solid fa-xmark text-xl text-gray-400"></i></button>
    </div>
    <div class="p-6 overflow-y-auto flex-1 space-y-6 bg-gray-50">
        <div id="detalhe-status-box"></div>
        <div>
            <h5 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Inspetor</h5>
            <div class="bg-white p-3 rounded-xl border flex items-center gap-3">
                <div id="detalhe-avatar" class="w-8 h-8 rounded-full bg-shopee text-white flex items-center justify-center text-xs font-bold">?</div>
                <span id="detalhe-autor" class="font-bold text-sm"></span>
            </div>
        </div>
        <div>
            <h5 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Local e Categoria</h5>
            <p class="bg-white p-3 rounded-xl border text-sm"><strong id="detalhe-hub" class="text-shopee"></strong><br><span id="detalhe-categoria"></span></p>
        </div>
        <div>
            <h5 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Relato</h5>
            <p id="detalhe-texto" class="bg-white p-3 rounded-xl border text-sm text-gray-600"></p>
        </div>
        <div>
            <h5 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Fotos</h5>
            <div id="detalhe-galeria-fotos" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>
</div>

<div id="login-screen" class="flex w-full h-full absolute inset-0 z-50 bg-white">
    <div class="hidden md:flex flex-1 bg-shopee flex-col justify-center items-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-shopee to-shopee-dark opacity-90"></div>
        <video autoplay loop muted playsinline class="w-64 h-64 rounded-[3rem] shadow-2xl z-10 bg-white p-2">
            <source src="https://i.imgur.com/iKdPvMx.mp4" type="video/mp4">
        </video>
        <h1 class="text-white text-3xl font-black mt-8 z-10">SIPAT LMG-48</h1>
    </div>
    <div class="flex-1 flex justify-center items-center bg-gray-50 p-6">
        <div class="w-full max-w-sm bg-white p-10 rounded-[2.5rem] shadow-xl border border-gray-100">
            <div class="md:hidden flex justify-center mb-6">
                <video autoplay loop muted playsinline class="w-24 h-24 rounded-2xl shadow-lg border border-shopee/20"><source src="https://i.imgur.com/iKdPvMx.mp4" type="video/mp4"></video>
            </div>
            <h2 class="text-xl font-bold text-center mb-8 text-gray-700 uppercase tracking-tighter">Entrar no Portal</h2>
            <div class="space-y-4">
                <input type="text" id="username" class="w-full bg-gray-50 border rounded-2xl px-5 py-4 focus:ring-2 focus:ring-shopee outline-none" placeholder="ID Usuário">
                <input type="password" id="password" class="w-full bg-gray-50 border rounded-2xl px-5 py-4 focus:ring-2 focus:ring-shopee outline-none" placeholder="Senha">
                <button onclick="window.fazerLogin()" class="w-full bg-shopee text-white font-black py-5 rounded-2xl shadow-lg hover:bg-shopee-dark transition-all">ACESSAR</button>
            </div>
        </div>
    </div>
</div>

<div id="app-layout" class="hidden flex-col h-full w-full bg-gray-50">
    <header class="bg-white border-b sticky top-0 z-40 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <video autoplay loop muted playsinline class="h-10 w-10 rounded-lg mr-2"><source src="https://i.imgur.com/iKdPvMx.mp4" type="video/mp4"></video>
                <span class="font-black text-xl text-shopee">LMG-48</span>
            </div>
            <div id="user-display-avatar" class="w-10 h-10 rounded-full bg-shopee text-white flex items-center justify-center font-bold cursor-pointer" onclick="window.sair()">?</div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-6xl mx-auto h-full">

            <div id="aba-menu-inspetor" class="hidden grid grid-cols-2 gap-4 max-w-xl mx-auto mt-10">
                <button onclick="window.mudarAba('registro')" class="card-interaction col-span-2 bg-white border-2 border-shopee rounded-3xl p-10 flex flex-col items-center gap-4">
                    <i class="fa-solid fa-triangle-exclamation text-6xl text-shopee"></i>
                    <span class="font-black text-xl uppercase">Relatar Risco</span>
                </button>
                <button onclick="window.mudarAba('progresso')" class="card-interaction bg-white rounded-3xl p-6 border-b-4 border-shopee flex flex-col items-center gap-2">
                    <i class="fa-solid fa-chart-line text-3xl text-shopee"></i>
                    <span class="font-bold text-xs uppercase">Meu Progresso</span>
                </button>
                <button onclick="window.sair()" class="card-interaction bg-white rounded-3xl p-6 border-b-4 border-shopee flex flex-col items-center gap-2">
                    <i class="fa-solid fa-power-off text-3xl text-shopee"></i>
                    <span class="font-bold text-xs uppercase">Sair</span>
                </button>
            </div>

            <div id="aba-registro" class="hidden max-w-2xl mx-auto">
                <div class="flex items-center gap-4 mb-6">
                    <button onclick="window.voltarMenu()" class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
                    <h2 class="text-xl font-black uppercase">Novo Registro</h2>
                </div>
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="hub_local" class="bg-gray-50 border p-4 rounded-xl outline-none focus:ring-2 focus:ring-shopee">
                            <option value="" disabled selected>Base...</option>
                            <option>Hub Uberaba</option><option>Hub Uberlândia</option><option>Hub Divinópolis</option>
                        </select>
                        <select id="categoria" class="bg-gray-50 border p-4 rounded-xl outline-none focus:ring-2 focus:ring-shopee">
                            <option value="" disabled selected>Risco...</option>
                            <option>EPI</option><option>Volumosos</option><option>Docas</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="date" id="data_ocorrencia" class="bg-gray-50 border p-4 rounded-xl">
                        <input type="time" id="hora_ocorrencia" class="bg-gray-50 border p-4 rounded-xl">
                    </div>
                    <textarea id="detalhes" rows="3" class="w-full bg-gray-50 border p-4 rounded-xl outline-none" placeholder="Descrição técnica..."></textarea>
                    
                    <div class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center relative hover:bg-orange-50 transition-colors">
                        <i class="fa-solid fa-camera text-2xl text-gray-300 mb-2"></i>
                        <p class="text-xs font-bold text-gray-400 uppercase" id="upload-text">Adicionar Fotos (Max 5)</p>
                        <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="window.processarNovaFoto(event)">
                    </div>
                    <div id="preview-fotos-container" class="grid grid-cols-5 gap-2"></div>
                    
                    <button id="btn-enviar" onclick="window.salvarFormulario()" class="w-full bg-shopee text-white font-black py-5 rounded-2xl shadow-lg uppercase tracking-widest">Transmitir Agora</button>
                </div>
            </div>

            <div id="aba-progresso" class="hidden max-w-4xl mx-auto">
                <button onclick="window.voltarMenu()" class="mb-6 flex items-center gap-2 font-bold text-shopee"><i class="fa-solid fa-arrow-left"></i> VOLTAR</button>
                <div class="bg-white rounded-3xl shadow overflow-hidden">
                    <table class="w-full text-left"><thead class="bg-gray-50 border-b"><tr><th class="p-5 text-[10px] font-black text-gray-400 uppercase">Unidade</th><th class="p-5 text-[10px] font-black text-gray-400 uppercase">Status</th></tr></thead><tbody id="tabela-meu-progresso"></tbody></table>
                </div>
            </div>

            <div id="aba-dashboard" class="hidden space-y-6 pb-20">
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-3xl border shadow-sm"><h4 class="text-[10px] font-bold text-gray-400 uppercase">Total</h4><h2 id="kpi-total" class="text-3xl font-black">0</h2></div>
                    <div class="bg-white p-6 rounded-3xl border shadow-sm"><h4 class="text-[10px] font-bold text-gray-400 uppercase">Aguardando</h4><h2 id="kpi-pendentes" class="text-3xl font-black text-yellow-500">0</h2></div>
                    <div class="bg-white p-6 rounded-3xl border shadow-sm"><h4 class="text-[10px] font-bold text-gray-400 uppercase">Concluído</h4><h2 id="kpi-resolvidos" class="text-3xl font-black text-green-500">0</h2></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-3xl border shadow-sm flex flex-col items-center">
                        <canvas id="graficoStatus" class="max-h-48"></canvas>
                    </div>
                    <div class="lg:col-span-2 bg-white rounded-3xl border shadow-sm overflow-hidden">
                        <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-gray-50 border-b"><th class="p-4 uppercase text-[10px] font-black text-gray-400">Unidade</th><th class="p-4 uppercase text-[10px] font-black text-gray-400">Inspetor</th><th class="p-4 uppercase text-[10px] font-black text-gray-400">Status</th><th class="p-4"></th></tr></thead><tbody id="tabela-dados" class="divide-y"></tbody></table></div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCrTjdAsHZ6JK1WNjZFeC5vHI0ICif4rxQ",
        authDomain: "sipat-lmg48.firebaseapp.com",
        projectId: "sipat-lmg48",
        storageBucket: "sipat-lmg48.firebasestorage.app",
        messagingSenderId: "310487581169",
        appId: "1:310487581169:web:3fd4c5e0f984a821114450"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.ocorrencias = [];
    window.usuarioAtual = '';
    window.nomeUsuarioAtual = '';
    window.indiceEmEdicao = null;
    window.fotosBinariasTemporarias = [];
    let graficoChartJS = null;

    // Escuta Realtime
    onSnapshot(query(collection(db, "ocorrencias_lmg48"), orderBy("timestamp", "desc")), (snap) => {
        window.ocorrencias = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if(window.usuarioAtual === 'admin') atualizarDashboardUI();
        if(window.usuarioAtual === 'davidsilveira') renderizarMeuProgresso();
    });

    // COMPRESSÃO RÁPIDA (BLOB)
    async function comprimir(file) {
        return new Promise(res => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const canvas = document.createElement('canvas');
                const MAX = 640;
                let w = img.width, h = img.height;
                if(w > MAX) { h *= MAX/w; w = MAX; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0,0,w,h);
                canvas.toBlob(blob => res({blob, preview: canvas.toDataURL('image/jpeg', 0.5)}), 'image/jpeg', 0.5);
            };
            img.src = url;
        });
    }

    // EXPOR FUNÇÕES PARA O WINDOW (Corrigindo o erro de login)
    window.fazerLogin = () => {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === "admin" && p === "spxadminl#") {
            window.usuarioAtual = 'admin'; window.nomeUsuarioAtual = 'Gestor ADM';
            entrarApp('dashboard');
        } else if(u === "davidsilveira" && p === "1234") {
            window.usuarioAtual = 'davidsilveira'; window.nomeUsuarioAtual = 'David Silveira';
            entrarApp('menu-inspetor');
        } else { alert("Erro!"); }
    };

    function entrarApp(aba) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('app-layout').classList.add('flex');
        document.getElementById('user-display-avatar').innerText = window.nomeUsuarioAtual.substring(0,2).toUpperCase();
        window.mudarAba(aba);
    }

    window.mudarAba = (a) => {
        ['dashboard', 'registro', 'menu-inspetor', 'progresso'].forEach(i => document.getElementById('aba-'+i).classList.add('hidden'));
        document.getElementById('aba-'+a).classList.remove('hidden');
    };

    window.processarNovaFoto = async (e) => {
        const file = e.target.files[0];
        if(!file || window.fotosBinariasTemporarias.length >= 5) return;
        document.getElementById('upload-text').innerText = "Otimizando...";
        const {blob, preview} = await comprimir(file);
        window.fotosBinariasTemporarias.push(blob);
        const cont = document.getElementById('preview-fotos-container');
        const idx = window.fotosBinariasTemporarias.length - 1;
        cont.innerHTML += `<div class="relative h-16 rounded-lg overflow-hidden border"><img src="${preview}" class="w-full h-full object-cover"></div>`;
        document.getElementById('upload-text').innerText = "Adicionar Foto ("+window.fotosBinariasTemporarias.length+"/5)";
    };

    window.salvarFormulario = async () => {
        const btn = document.getElementById('btn-enviar');
        btn.disabled = true; btn.innerText = "TRANSMITINDO...";
        try {
            const uploadPromises = window.fotosBinariasTemporarias.map(async (blob, i) => {
                const sRef = ref(storage, `lmg48/foto_${Date.now()}_${i}.jpg`);
                await uploadBytes(sRef, blob);
                return getDownloadURL(sRef);
            });
            const urls = await Promise.all(uploadPromises);
            const data = document.getElementById('data_ocorrencia').value.split('-').reverse().join('/');
            await addDoc(collection(db, "ocorrencias_lmg48"), {
                local: document.getElementById('hub_local').value,
                categoria: document.getElementById('categoria').value,
                data: data + " às " + document.getElementById('hora_ocorrencia').value,
                detalheCompleto: document.getElementById('detalhes').value,
                fotos_urls: urls, status: "Pendente", autor: window.nomeUsuarioAtual, timestamp: serverTimestamp()
            });
            alert("Enviado!"); location.reload();
        } catch(e) { alert("Erro de conexão!"); btn.disabled = false; }
    };

    window.abrirDetalhes = (idx) => {
        const o = window.ocorrencias[idx];
        document.getElementById('detalhe-hub').innerText = o.local;
        document.getElementById('detalhe-categoria').innerText = o.categoria;
        document.getElementById('detalhe-data').innerText = o.data;
        document.getElementById('detalhe-texto').innerText = o.detalheCompleto;
        document.getElementById('detalhe-autor').innerText = o.autor;
        const statusBox = document.getElementById('detalhe-status-box');
        statusBox.innerHTML = `<span class="px-3 py-1 rounded-full text-[10px] font-bold border ${o.status === 'Resolvido' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${o.status}</span>`;
        const gal = document.getElementById('detalhe-galeria-fotos');
        gal.innerHTML = (o.fotos_urls || []).map(u => `<a href="${u}" target="_blank"><img src="${u}" class="h-24 w-full object-cover rounded-lg border"></a>`).join('');
        document.getElementById('slide-overlay').classList.add('active');
        document.getElementById('slide-panel').classList.add('active');
    };

    window.fecharDetalhes = () => { document.getElementById('slide-overlay').classList.remove('active'); document.getElementById('slide-panel').classList.remove('active'); };
    window.abrirDropdownStatus = (e, i) => { e.stopPropagation(); window.indiceEmEdicao = i; const d = document.getElementById('statusDropdown'); d.style.left = e.clientX+'px'; d.style.top = e.clientY+'px'; d.classList.add('active'); };
    window.fecharDropdownStatus = () => document.getElementById('statusDropdown').classList.remove('active');
    window.atualizarStatus = async (s) => { if(window.indiceEmEdicao !== null) { await updateDoc(doc(db, "ocorrencias_lmg48", window.ocorrencias[window.indiceEmEdicao].id), {status: s}); window.fecharDropdownStatus(); } };
    
    window.sair = () => location.reload();
    window.voltarMenu = () => window.mudarAba('menu-inspetor');

    function atualizarDashboardUI() {
        const tb = document.getElementById('tabela-dados');
        let p=0, r=0, c=0;
        tb.innerHTML = window.ocorrencias.map((o, i) => {
            if(o.status==='Pendente') p++; else if(o.status==='Resolvido') r++; else c++;
            return `<tr><td class="p-4 font-bold">${o.local}</td><td class="p-4 text-xs">${o.autor}</td><td class="p-4"><button onclick="window.abrirDropdownStatus(event, ${i})" class="px-3 py-1 rounded-full text-[10px] font-bold border">${o.status}</button></td><td class="p-4 text-center"><button onclick="window.abrirDetalhes(${i})" class="text-shopee"><i class="fa-solid fa-eye"></i></button></td></tr>`;
        }).join('');
        document.getElementById('kpi-total').innerText = window.ocorrencias.length;
        document.getElementById('kpi-pendentes').innerText = p; document.getElementById('kpi-resolvidos').innerText = r;
        desenharGrafico(p,r,c);
    }

    function desenharGrafico(p,r,c) {
        const ctx = document.getElementById('graficoStatus').getContext('2d');
        if(graficoChartJS) graficoChartJS.destroy();
        graficoChartJS = new Chart(ctx, { type: 'doughnut', data: { datasets: [{ data: [p,r,c], backgroundColor: ['#F59E0B', '#10B981', '#EF4444'], borderWidth: 0 }] }, options: { cutout: '80%' } });
    }

    function renderizarMeuProgresso() {
        const tb = document.getElementById('tabela-meu-progresso');
        tb.innerHTML = window.ocorrencias.filter(o => o.autor === window.nomeUsuarioAtual).map(o => `<tr><td class="p-5 font-bold">${o.local}</td><td class="p-5"><span class="px-3 py-1 rounded-full text-[10px] font-bold border">${o.status}</span></td></tr>`).join('');
    }

    document.addEventListener('click', window.fecharDropdownStatus);
    document.addEventListener('keydown', e => { if(e.key==='Escape') { window.fecharDetalhes(); window.fecharDropdownStatus(); } });
</script>

</body>
</html>
